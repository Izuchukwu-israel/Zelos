<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zelos — Your Injective Opportunity Guide</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">⚡ Zelos</div>
        <p class="tagline">Your Injective Opportunity Guide</p>
      </header>

      <main>
        <div class="input-section">
          <label for="walletInput">Enter your Injective wallet address</label>
          <input
            type="text"
            id="walletInput"
            placeholder="inj1..."
            autocomplete="off"
          />
          <button id="analyzeBtn">Analyze Wallet</button>
        </div>

        <div class="status" id="status" style="display: none"></div>

        <div class="results" id="results" style="display: none">
          <div class="results-inner" id="resultsContent"></div>
        </div>
      </main>

      <footer>
        <p>
          Built on
          <a href="https://injective.com" target="_blank">Injective</a> ·
          Powered by Zelos
        </p>
      </footer>
    </div>

    <script src="dist/bundle.js"></script>
    <script>
      const btn = document.getElementById("analyzeBtn");
      const input = document.getElementById("walletInput");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const resultsContent = document.getElementById("resultsContent");

      btn.addEventListener("click", async () => {
        const address = input.value.trim();

        if (!address || !address.startsWith("inj1")) {
          showStatus(
            "⚠️ Please enter a valid Injective address starting with inj1",
            "error",
          );
          return;
        }

        showStatus("🔍 Fetching your on-chain data...", "loading");
        btn.disabled = true;

        try {
          const walletData = await window.fetchAll(address);
          showStatus("🤖 Zelos is analyzing your wallet...", "loading");
          const analysis = await window.analyzeWallet(walletData, address);
          if (!analysis || analysis.startsWith("Error")) {
            showStatus("❌ " + (analysis || "Analysis failed"), "error");
            btn.disabled = false;
            return;
          }
          showResult(analysis);
        } catch (err) {
          showStatus("❌ Error: " + err.message, "error");
          console.error(err);
        }

        btn.disabled = false;
      });

      function showStatus(message, type) {
        status.style.display = "block";
        results.style.display = "none";
        status.className = "status " + type;
        status.textContent = message;
      }

      function showResult(text) {
        status.style.display = "none";
        results.style.display = "block";

        // Extract tweet section before rendering
        let tweetText = "";
        let displayText = text;
        const tweetMatch = text.match(/## 🐦 Tweet\n?([\s\S]*?)$/);
        if (tweetMatch) {
          tweetText = tweetMatch[1].trim();
          displayText = text.replace(/## 🐦 Tweet[\s\S]*$/, "");
        }

        // Format and split into sections for animation
        const html = formatMarkdown(displayText);
        const sections = html.split("<h2>");
        let finalHtml = sections[0];
        sections.slice(1).forEach((section, i) => {
          finalHtml += `<div class="section-reveal" style="animation-delay:${i * 0.18}s"><h2>${section}</div>`;
        });

        resultsContent.innerHTML = finalHtml;

        // Add share button if tweet was generated
        if (tweetText) {
          const shareBtn = document.createElement("button");
          shareBtn.className = "share-btn";
          shareBtn.innerHTML = "𝕏 &nbsp;Share Your Results";
          shareBtn.onclick = () => {
            window.open(
              `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`,
              "_blank",
            );
          };
          resultsContent.appendChild(shareBtn);
        }
      }

      function formatMarkdown(text) {
        return text
          .replace(/## (.*)/g, "<h2>$1</h2>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.*?)\*/g, "<em>$1</em>")
          .replace(/\n/g, "<br/>")
          .replace(
            /(https?:\/\/[^\s<"]+)/g,
            '<a href="$1" target="_blank">$1</a>',
          );
      }
    </script>
  </body>
</html>
